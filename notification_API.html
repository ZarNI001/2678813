<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification API Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
      }

      button {
        padding: 12px;
        margin: 5px;
        cursor: pointer;
      }

      #status {
        margin-top: 20px;
        padding: 12px;
        background: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <h2>Notification API</h2>

    <button onclick="requestPermission()">Request Permission</button>

    <button onclick="showNotification()">Show Notification</button>

    <p id="status">Click a button to begin.</p>

    <script>
      const statusElement = document.getElementById("status");

      async function requestPermission() {
        if (!("Notification" in window)) {
          statusElement.innerText =
            "This browser does not support notifications.";
          return;
        }

        try {
          const permission = await Notification.requestPermission();
          if (permission === "granted") {
            showNotification();
          } else {
            statusElement.innerText =
              permission === "denied"
                ? "Notifications are blocked. Allow them for 127.0.0.1 in your browser's site settings, then try again."
                : "Notification permission was not granted.";
          }
        } catch (error) {
          statusElement.innerText =
            "Could not request notification permission: " + error.message;
        }
      }

      async function showNotification() {
        if (!("Notification" in window)) {
          statusElement.innerText =
            "This browser does not support notifications.";
          return;
        }

        if (Notification.permission === "default") {
          await requestPermission();
          return;
        }

        if (Notification.permission === "granted") {
          try {
            new Notification("Hello Student!", {
              body: "This is a notification from the Notification API.",
            });
            statusElement.innerText = "Notification shown successfully.";
          } catch (error) {
            statusElement.innerText =
              "The browser could not display the notification: " +
              error.message +
              ". Check your browser and system notification settings.";
          }
          return;
        }

        statusElement.innerText =
          "Notifications are blocked. Allow them for 127.0.0.1 in your browser's site settings, then try again.";
      }
    </script>
  </body>
</html>
