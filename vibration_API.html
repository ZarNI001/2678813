<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Vibration API</h2>
    <button onclick="vibrateDevice()">Vibrate Device</button>
    <p id="result"></p>

    <script>
      function vibrateDevice() {
        if (navigator.vibrate) {
          navigator.vibrate(500); // Vibrate for 500 milliseconds
          document.getElementById("result").innerText =
            "Device is vibrating for 500ms.";
        } else {
          document.getElementById("result").innerText =
            "Vibration API is not supported in this browser.";
        }
      }
    </script>
  </body>
</html>
