<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 25px;
      }

      button {
        padding: 10px;
        margin: 5px;
        cursor: pointer;
      }

      #result {
        margin-top: 20px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <h2>Geolocation API</h2>
    <button onclick="getLocation()">Get Location</button>
    <button onclick="watchLocation()">Watch Location</button>
    <button onclick="stopWatching()">Stop Watching</button>
    <p id="status">Location status will appear here.</p>
    <p id="result"></p>
    <script>
      let watchId = null;
      const statusElement = document.getElementById("status");
      const resultElement = document.getElementById("result");

      function isSupported() {
        if (!navigator.geolocation) {
          statusElement.innerText =
            "Geolocation is not supported by this browser.";
          return false;
        }
        return true;
      }

      function showPosition(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        statusElement.innerText = "Location retrieved.";
        resultElement.innerHTML =
          "<p><b>Latitude:</b> " +
          latitude +
          "<br><b>Longitude:</b> " +
          longitude +
          "<br><b>Accuracy:</b> " +
          accuracy +
          " meters</p>" +
          "<a href='https://www.google.com/maps?q=" +
          latitude +
          "," +
          longitude +
          "' target='_blank'>View on Google Maps</a>";
      }

      function showError(error) {
        statusElement.innerText = "Unable to get location.";
        resultElement.innerText = "Error: " + error.message;
      }

      function getLocation() {
        if (!isSupported()) return;

        navigator.geolocation.getCurrentPosition(showPosition, showError);
      }

      function watchLocation() {
        if (!isSupported()) return;

        if (watchId !== null) {
          statusElement.innerText = "Already watching location.";
          return;
        }

        watchId = navigator.geolocation.watchPosition(showPosition, showError);
        statusElement.innerText = "Watching location updates...";
      }

      function stopWatching() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
          statusElement.innerText = "Stopped watching location.";
          return;
        }

        statusElement.innerText = "Not currently watching location.";
      }
    </script>
  </body>
</html>
